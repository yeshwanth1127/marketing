# EXORA Marketing OS — https://marketing.exora.solutions → 127.0.0.1:8108
# Install on gateway host:
#   cp deploy/nginx/marketing.exora.solutions.conf /srv/gateway/nginx/sites/
#   docker exec gateway nginx -t && docker exec gateway nginx -s reload
#
# TLS (after DNS A/AAAA points here):
#   certbot certonly --webroot -w /var/www/certbot -d marketing.exora.solutions

server {
    listen 80;
    listen [::]:80;
    server_name marketing.exora.solutions;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketing.exora.solutions;

    include /etc/nginx/snippets/acme-challenge.conf;
    ssl_certificate     /etc/letsencrypt/live/marketing.exora.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.exora.solutions/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    location / {
        proxy_pass         http://127.0.0.1:8108;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    access_log /var/log/nginx/marketing_access.log;
    error_log  /var/log/nginx/marketing_error.log;
}
