tools: []
# External connectors are deferred. No network, shell or SQL tool is exposed to the model.
services: [record-store]
scripts:
  - id: clv
    skill: exec-summary
    scripts: dmp
    file: clv-calculator.py
    mode: direct
    output: json
    label: Customer lifetime value (DMP clv-calculator.py)
    params:
      - {name: model, flag: --model, type: choice, choices: [simple, cohort, contractual], label: Model}
      - {name: avg_purchase_value, flag: --avg-purchase-value, type: number, min: 0, label: Average order value (INR)}
      - {name: purchase_frequency, flag: --purchase-frequency, type: number, min: 0, label: Purchases per year}
      - {name: customer_lifespan, flag: --customer-lifespan, type: number, min: 0, label: Customer lifespan (years)}
      - {name: margin, flag: --margin, type: number, min: 0, max: 100, label: Gross margin (%)}
      - {name: monthly_revenue, flag: --monthly-revenue, type: number, min: 0, label: Monthly revenue per customer (contractual)}
      - {name: churn_rate, flag: --churn-rate, type: number, min: 0, max: 1, label: Monthly churn (0.05 = 5%)}
      - {name: cac, flag: --cac, type: number, min: 0, label: Acquisition cost (INR)}
      - {name: segments, flag: --segments, type: json, label: Segments (cohort model)}
    example: {model: simple, avg_purchase_value: 2500, purchase_frequency: 2, customer_lifespan: 4, margin: 60, cac: 1800}
  - id: revenue-forecast
    skill: exec-summary
    scripts: dmp
    file: revenue-forecaster.py
    mode: direct
    output: json
    label: Revenue forecast (DMP revenue-forecaster.py)
    params:
      - {name: historical, flag: --historical, type: json, required: true, label: 'Months: [{"month":"2026-07","revenue":420000,"spend":90000}]'}
      - {name: forecast_months, flag: --forecast-months, type: number, min: 1, max: 24, label: Months to forecast}
      - {name: growth, flag: --growth-assumption, type: number, min: -1, max: 2, label: Monthly growth override (0.05 = 5%)}
      - {name: seasonality, flag: --seasonality, type: json, label: 'Seasonality: {"10":1.3,"11":1.5}'}
    example: {historical: [{month: "2026-06", revenue: 400000, spend: 90000}, {month: "2026-07", revenue: 420000, spend: 92000}, {month: "2026-08", revenue: 450000, spend: 95000}, {month: "2026-09", revenue: 470000, spend: 98000}], forecast_months: 3}
  - id: team
    skill: team-assign
    scripts: dmp
    file: team-manager.py
    mode: direct
    state: persistent
    args: ["--brand", "{brand}"]
    output: json
    label: Team roles, capacity and assignments (DMP team-manager.py)
    params:
      - {name: action, flag: --action, type: choice, required: true, choices: [list-team, add-member, update-role, remove-member, check-capacity, assign-task, get-assignments, get-approval-chain], label: Action}
      - {name: data, flag: --data, type: json, label: 'Data, e.g. {"member_id":"asha","name":"Asha","role":"designer"}'}
      - {name: id, flag: --id, type: string, label: Member ID}
      - {name: role, flag: --role, type: string, label: Role filter}
      - {name: status, flag: --status, type: choice, choices: [pending, in-progress, completed], label: Assignment status}
    example: {action: list-team}
