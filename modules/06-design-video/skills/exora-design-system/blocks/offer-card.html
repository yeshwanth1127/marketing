<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#f6f7f4;--ink:#18261f;--accent:#274c3b;--font:Arial,Helvetica,sans-serif}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1080px;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;display:grid;place-items:center}
.card{width:880px;padding:72px;border-radius:32px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;gap:32px}
h2{font-size:84px;line-height:1.05}.line{font-size:36px;line-height:1.4}
.cta{align-self:flex-start;background:var(--accent);color:#fff;font-size:34px;font-weight:700;padding:22px 40px;border-radius:999px}
</style></head><body><section class="card"><h2>The offer</h2><p class="line">Why it matters, in one line.</p><span class="cta">Book a visit</span></section></body></html>
