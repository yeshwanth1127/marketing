<!doctype html><html><head><meta charset="utf-8"><style>
:root{--bg:#18261f;--ink:#ffffff;--accent:#c8f077;--font:Arial,Helvetica,sans-serif}
*{box-sizing:border-box;margin:0}body{width:1080px;height:1350px;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
.frame{height:100%;padding:64px;display:flex;flex-direction:column;justify-content:center;gap:40px}
.eyebrow{font-size:30px;letter-spacing:4px;text-transform:uppercase;color:var(--accent)}
h1{font-size:104px;line-height:1.05;font-weight:800;max-width:900px}
.support{font-size:38px;line-height:1.4;max-width:820px;opacity:.9}
</style></head><body><main class="frame"><div class="eyebrow">Brand name</div><h1>The hook goes here</h1><p class="support">One supporting line.</p></main></body></html>
