# Model tools: none (no network, shell or SQL for Claude). Skill scripts below run in a sandbox via core/tools/runner.mjs.
tools: []
services: [record-store]
scripts:
  - id: caption-lint
    skill: ig-caption
    file: caption.py
    mode: direct
    args: ["-", "--json"]
    input: caption text on stdin
    output: json
  - id: ai-tell
    skill: ig-human
    file: detect.py
    mode: direct
    args: ["-", "--json"]
    input: script + caption on stdin
    output: json
  - id: beat-sheet
    skill: ig-reel
    module: 04-hooks     # owned by Step 4; used read-only here
    file: beats.py
    mode: direct
    args: ["-", "--json"]
    input: reel script on stdin
    output: json
  - id: quality-gate
    skill: check
    scripts: dmp          # DMP shared scripts folder; brand profile prepared by core/tools/dmp.mjs
    file: eval-runner.py
    mode: direct
    args: ["--action", "run-full", "--file", "{input_file}", "--brand", "{brand}", "--evidence", "{evidence_file}"]
    input: script + caption
    output: json
    timeout_ms: 90000
  - id: claim-check
    skill: verify-claims
    scripts: dmp
    file: claim-verifier.py
    mode: direct
    args: ["--action", "verify", "--file", "{input_file}", "--evidence", "{evidence_file}"]
    input: script + caption
    output: json
