# EXORA Marketing OS — server: docker compose up -d --build  (from /srv/apps/marketing)
# Copy .env.example → .env and fill secrets before first start.
name: exora-marketing

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: exora_marketing
    volumes:
      - marketing_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exora -d exora_marketing"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    build:
      context: .
      entitlements:
        - network.host
    image: exora-marketing:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://exora:${POSTGRES_PASSWORD}@postgres:5432/exora_marketing
      NODE_ENV: production
      EXORA_PUBLIC_ORIGIN: ${EXORA_PUBLIC_ORIGIN:-https://marketing.exora.solutions}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-https://marketing.exora.solutions/api/auth/meta/callback}
      EXORA_ROUTER_PROVIDER: ${EXORA_ROUTER_PROVIDER:-claude}
    volumes:
      - ./data/local:/app/.local
      - claude_home:/root
    ports:
      - "127.0.0.1:${MARKETING_HOST_PORT:-8108}:3100"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1536m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  worker:
    image: exora-marketing:latest
    env_file: .env
    environment:
      DATABASE_URL: postgresql://exora:${POSTGRES_PASSWORD}@postgres:5432/exora_marketing
      NODE_ENV: production
      EXORA_ROUTER_PROVIDER: ${EXORA_ROUTER_PROVIDER:-claude}
    volumes:
      - ./data/local:/app/.local
      - claude_home:/root
    entrypoint: ["docker-entrypoint.sh"]
    command: ["node", "scripts/worker.mjs"]
    # The image's default healthcheck probes the web server on port 3100.
    # The worker has no HTTP listener; check its database heartbeat instead.
    healthcheck:
      test: ["CMD", "node", "-e", "import('pg').then(async ({default:pg})=>{const p=new pg.Pool({connectionString:process.env.DATABASE_URL});try{const r=await p.query(\"SELECT 1 FROM service_heartbeats WHERE service='worker' AND status='online' AND updated_at>now()-interval '15 seconds'\");await p.end();process.exit(r.rowCount===1?0:1)}catch(e){await p.end().catch(()=>{});process.exit(1)}}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    mem_limit: 2048m
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  marketing_pg:
  claude_home:
